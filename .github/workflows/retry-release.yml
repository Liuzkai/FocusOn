name: Retry failed desktop release jobs
on:
  push:
    branches: [main]
    paths: ['.github/release-retries/*.json']
  workflow_dispatch:
    inputs:
      request_file:
        description: Committed request under .github/release-retries/
        required: true
permissions:
  contents: read
  actions: write
jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retry only a failed draft job after native validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_FILE: ${{ inputs.request_file }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/retry_release_jobs.py
