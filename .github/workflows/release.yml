name: Verified desktop release draft
on:
  push:
    tags: ['v[0-9]*']
    branches: [main]
    paths: ['.github/release-publication/*.json']
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing immutable version tag to build (for example v0.1.1)
        required: true
      publish_existing:
        description: Publish an existing verified draft using its committed approval record
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-release-${{ inputs.version_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    if: (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: python3 scripts/check_release_source.py >> "$GITHUB_OUTPUT"
  build:
    needs: source
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
      sign_mac: true
    secrets: inherit
    permissions:
      contents: write
      actions: read
  draft:
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: FocusOn-*
          path: artifacts/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: evidence-*
          path: artifacts/evidence
      - name: Upload verified immutable assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/create_desktop_draft.py
      - name: Record draft status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULT: ${{ needs.build.result }}
        run: python3 scripts/write_desktop_report.py
  publish-approved:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_existing)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify and publish the explicitly approved existing draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version_tag || 'v0.1.1' }}
        run: python3 scripts/publish_approved_release.py
      - name: Record public release result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULT: ${{ steps.publish.outcome }}
        run: python3 scripts/write_desktop_report.py
